name: Mobile CI

on:
  push:
    branches: [main, staging]
    paths: ['worker-mobile-app/**']
  pull_request:
    branches: [main, staging]

jobs:
  typecheck:
    name: Mobile Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-mobile-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker-mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Environment selection tests
        run: npm run test:env

      - name: Home shift selection tests
        run: node --test scripts/home-shifts.test.cjs

      - name: Push registration lifecycle tests
        run: npm run test:push

  expo-doctor:
    name: Mobile Expo Doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-mobile-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker-mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor
